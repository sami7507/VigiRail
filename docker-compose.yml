# VigiRail — full self-host stack (optional alternative to Render + Vercel).
#   docker compose up --build
# Web:  http://localhost:8080
# API:  http://localhost:8000  (docs at /docs)
services:
  api:
    build: ./backend
    environment:
      VIGIRAIL_ENVIRONMENT: production
      # Generate once: python -c "import secrets; print(secrets.token_urlsafe(48))"
      VIGIRAIL_SECRET_KEY: ${VIGIRAIL_SECRET_KEY:?Set VIGIRAIL_SECRET_KEY in your shell or .env}
      VIGIRAIL_CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
