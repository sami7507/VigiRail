# VigiRail — Render blueprint (Blueprints → New → from this repo)
#
# Hosts the API as a Docker web service on the free plan.
# The frontend is deployed separately on Vercel (see frontend/vercel.json).
#
# After the first deploy, set the real frontend URL in VIGIRAIL_CORS_ORIGINS
# (only needed if the frontend calls the API cross-origin instead of proxying).

services:
  - type: web
    name: vigirail-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: VIGIRAIL_ENVIRONMENT
        value: production
      - key: VIGIRAIL_SECRET_KEY
        generateValue: true
      - key: VIGIRAIL_CORS_ORIGINS
        value: https://vigirail.vercel.app,http://localhost:5173
